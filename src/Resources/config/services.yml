imports:
    - { resource: graphql.yml }
    - { resource: eventlistener.yml }

services:

    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # auto-register all commands as services
    Pimcore\Bundle\DataHubBundle\Command\:
        resource: '../../Command'

    Pimcore\Bundle\DataHubBundle\Controller\:
        resource: '../../Controller'
        public: true
        tags: [ 'controller.service_arguments' ]

    Pimcore\Bundle\DataHubBundle\Service\:
        resource: '../../Service'
        exclude:
            - '../../Service/Studio'
            # takes an explicitly wired argument, registered under its interface below
            - '../../Service/AdapterAvailabilityService.php'
        public: true
        autowire: true
        autoconfigure: true

    Pimcore\Bundle\DataHubBundle\Installer:
        public: true
        arguments:
            $bundle: "@=service('kernel').getBundle('PimcoreDataHubBundle')"

    Pimcore\Bundle\DataHubBundle\Service\OutputCacheServiceInterface:
        class: Pimcore\Bundle\DataHubBundle\Service\OutputCacheService

    Pimcore\Bundle\DataHubBundle\Service\AdapterAvailabilityServiceInterface:
        class: Pimcore\Bundle\DataHubBundle\Service\AdapterAvailabilityService
        arguments:
            $enabledTypes: '%pimcore_data_hub.enabled_adapter_types%'
