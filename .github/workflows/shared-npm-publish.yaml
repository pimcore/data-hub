name: shared-npm-publish

on:
  workflow_call:
    inputs:
      version:
        description: "The new version to set (e.g., 1.2.3)"
        required: true
        type: string
      tag:
        description: "The npm tag to use when publishing (default: latest)"
        required: false
        type: string
        default: "latest"

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ./assets/studio/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./assets/studio
        run: npm ci

  publish:
    runs-on: ubuntu-latest
    needs: install
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ./assets/studio/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Run build types
        working-directory: ./assets/studio
        run: npm run generate-types

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Set package version
        working-directory: ./assets/studio
        run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish package to npm with OIDC
        working-directory: ./assets/studio
        run: npx npm@latest publish --tag ${{ inputs.tag }} --access public
