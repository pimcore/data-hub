name: "Codeception Tests centralised"

on:
    schedule:
        - cron: "0 3 * * 1,3,5"
    workflow_dispatch:
    push:
        branches:
            - "[0-9]+.[0-9]+"
            - "[0-9]+.x"
    # TEMPORARY, REVERT BEFORE MERGING TO 2026.x:
    # `pull_request`, not `pull_request_target`, so that the core pin below is the
    # definition GitHub actually executes — under `pull_request_target` it runs a
    # definition without the pin and every job fails on core API that only exists
    # on cs-store-improvements. This matches studio-backend-bundle and
    # studio-ui-bundle, and data-hub's own static-analysis.yaml, which all use
    # `pull_request`. Safe for this epic: every PR is same-repo, so the
    # fork-secret reason for pull_request_target does not apply.
    pull_request:
        types: [opened, synchronize, reopened]

env:
    PIMCORE_PROJECT_ROOT: ${{ github.workspace }}
    PRIVATE_REPO: ${{ github.event.repository.private }}

concurrency:
    # TEMPORARY, REVERT BEFORE MERGING TO 2026.x:
    # 2026.x is the default branch and its copy of this workflow still declares
    # `pull_request_target`, so every PR here gets a second, unpinned run of the
    # same workflow name. Without `github.event_name` in the group the two runs
    # share a group and cancel each other, and which one survives is a race.
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    setup-matrix:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            php_versions: ${{ steps.parse-php-versions.outputs.php_versions }}
            matrix: ${{ steps.set-matrix.outputs.matrix }}
            private_repo: ${{ env.PRIVATE_REPO }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.pull_request.base.ref || github.ref }}

            - name: Checkout reusable workflow repo
              uses: actions/checkout@v4
              with:
                  repository: pimcore/workflows-collection-public
                  ref: main
                  path: reusable-workflows

            - name: Parse PHP versions from composer.json
              id: parse-php-versions
              run: |
                  if [ -f composer.json ]; then
                    php_versions=$(jq -r '.require.php' composer.json | grep -oP '\d+\.\d+' | tr '\n' ',' | sed 's/,$//')
                    if [ -z "$php_versions" ]; then
                      echo "No PHP versions found in composer.json"
                      echo "Setting default PHP value"
                      echo "php_versions=default" >> $GITHUB_OUTPUT
                    else
                      echo "php_versions=$php_versions" >> $GITHUB_OUTPUT
                      echo "#### php versions #### : $php_versions"
                    fi
                  else
                    echo "composer.json not found"
                    exit 1
                  fi

            - name: Set up matrix
              id: set-matrix
              run: |
                  php_versions="${{ steps.parse-php-versions.outputs.php_versions }}"

                  MATRIX_JSON=$(cat reusable-workflows/codeception-tests-configuration/matrix-config.json)

                  IFS=',' read -ra VERSIONS_ARRAY <<< "$php_versions"

                  # TEMPORARY, REVERT BEFORE MERGING TO 2026.x:
                  # this epic consumes core API that lives only on cs-store-improvements
                  # (Classification Store identifiers), so CI must install that branch instead
                  # of ^2026.4 from packagist. Without it PHPStan reports every new core method
                  # as undefined and codeception cannot boot.
                  FILTERED_MATRIX_JSON=$(echo $MATRIX_JSON | jq --arg php_versions "$php_versions" --arg pimcore_version 'dev-cs-store-improvements as 2026.99.9' '
                  {
                    matrix: [
                      .configs[] |
                      select(.php_version == $php_versions) |
                      .matrix[] |
                      . + {pimcore_version: $pimcore_version}
                    ]
                  }')

                  if [ "$(echo "$FILTERED_MATRIX_JSON" | jq '.matrix | length')" = "0" ]; then
                    echo "::error::No matrix configuration found for PHP versions '$php_versions'"
                    exit 1
                  fi
                  ENCODED_MATRIX_JSON=$(echo $FILTERED_MATRIX_JSON | jq -c .)

                  echo "matrix=${ENCODED_MATRIX_JSON}" >> $GITHUB_OUTPUT

    codeception-tests:
        needs: setup-matrix
        strategy:
            matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
        uses: pimcore/workflows-collection-public/.github/workflows/reusable-codeception-tests-centralized.yaml@main
        with:
            APP_ENV: test
            PIMCORE_TEST: 1
            PRIVATE_REPO: ${{ needs.setup-matrix.outputs.private_repo}}
            PHP_VERSION: ${{ matrix.matrix.php-version }}
            DATABASE: ${{ matrix.matrix.database }}
            SERVER_VERSION: ${{ matrix.matrix.server_version }}
            DEPENDENCIES: ${{ matrix.matrix.dependencies }}
            EXPERIMENTAL: ${{ matrix.matrix.experimental }}
            PIMCORE_VERSION: ${{ matrix.matrix.pimcore_version }}
        secrets:
            SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER: ${{ secrets.SSH_PRIVATE_KEY_PIMCORE_DEPLOYMENTS_USER }}
            COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN: ${{ secrets.COMPOSER_PIMCORE_REPO_PACKAGIST_TOKEN }}
            PIMCORE_INSTANCE_IDENTIFIER: ${{ secrets.PIMCORE_CI_INSTANCE_IDENTIFIER }}
            PIMCORE_ENCRYPTION_SECRET: ${{ secrets.PIMCORE_CI_ENCRYPTION_SECRET }}
            PIMCORE_PRODUCT_KEY: ${{ secrets.PIMCORE_CI_PRODUCT_KEY }}
