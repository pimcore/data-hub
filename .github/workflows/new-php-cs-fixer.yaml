name: "PHP-CS-Fixer"

on:
  pull_request:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
      - "feature-*"
  push:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
      - "*_actions"
      - "feature-*"

permissions:
  contents: write

jobs:
  php-cs-fixer:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-php-cs-fixer.yaml@main
    secrets: inherit
