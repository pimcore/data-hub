name: Frontend build and publish

on:
  push:
    branches:
      - "[0-9]+.x"
      - "[0-9].[0-9]"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: frontend-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  FALLBACK_TARGET_RELEASE: "2026.3.0"

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      target-release: ${{ steps.target.outputs.target-release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for frontend changes
        id: check
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          publish=false
          if [[ "${GITHUB_REF}" == refs/tags/* || "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            publish=true
          elif [[ -z "${BEFORE}" || "${BEFORE}" =~ ^0+$ ]]; then
            # New branch: no base to diff against — publish rather than miss one
            publish=true
          elif ! git fetch --quiet --no-tags --depth=1 origin "${BEFORE}"; then
            # Base commit unavailable (e.g. after a force push) — publish rather than miss one
            publish=true
          elif [[ -n "$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- assets/studio)" ]]; then
            publish=true
          fi
          echo "Frontend changed / must publish: ${publish}"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      - name: Determine canary target release
        id: target
        shell: bash
        run: |
          # Canary base version = next minor after the latest npm release
          PKG_NAME="$(node -p "require('./assets/studio/package.json').name" 2>/dev/null || true)"
          LATEST="$([ -n "${PKG_NAME}" ] && npm view "${PKG_NAME}" version 2>/dev/null || true)"
          if [[ "${LATEST}" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            TARGET="${BASH_REMATCH[1]}.$(( BASH_REMATCH[2] + 1 )).0"
          else
            TARGET="${FALLBACK_TARGET_RELEASE}"
          fi
          echo "Canary target release: ${TARGET}"
          echo "target-release=${TARGET}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    permissions:
      id-token: write  # Required for OIDC
      contents: write
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-frontend-publish-unified.yaml@main
    with:
      target-release: ${{ needs.gate.outputs.target-release }}
      pre-publish-script: generate-types
      build-output-path: './src/Resources/public/studio/'
      commit-lint-output: false
      commit-build-output: false
