name: "Studio Frontend Build"

on:
  push:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
    paths:
      - "assets/studio/**"
      - "build-dist/**"
  pull_request:
    paths:
      - "assets/studio/**"
      - ".github/workflows/studio-frontend-build.yaml"
  workflow_dispatch:

concurrency:
  group: studio-frontend-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: write

jobs:
  studio-frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets/studio
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: assets/studio/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run frontend tests
        run: npm test

  studio-frontend-build:
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build-packaged.yaml@main
    secrets:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
